name: Feature request
description: Propose an improvement to Ottr
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Before you open a request, check the open issues and the roadmap in [PRODUCT.md](https://github.com/ottr-ai/ottr/blob/main/PRODUCT.md).
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What do you try to do, and what stands in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposed solution
      description: What should Ottr do instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions or workarounds you considered. This one is optional.
    validations:
      required: false
